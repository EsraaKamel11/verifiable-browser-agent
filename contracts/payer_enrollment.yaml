contract: payer_enrollment
version: 3
site: enrollment_portal
goal: "Enroll a provider with their payer and confirm it posted to the payer's records."

oracle:
  kind: http_json
  url: "{base}/api/sor/enrollment/{npi}"
  strength: cross_system            # cross_system | on_page | none

identity:
  key: [npi, payer]
  resolve_ambiguity_by: oracle      # never by retry

steps:
  # Four of the five steps below carry an on-page postcondition. A step that
  # declares none passes whenever the page does not actively refuse it, so a
  # session that filled a form and never submitted it reported success and the run
  # walked on against the wrong page. page_verify steers the loop (spec 5.2) and it
  # can only steer on evidence the contract names.
  #
  # enrollment.select_payer is the exception, and deliberately so: which option a
  # dropdown has selected is STATE, and this schema's postcondition vocabulary is
  # text only (text_present / text_absent) over the page's own text. There is no
  # evidence available to name, so naming some would be worse than naming none.
  # The net is not that a wrong payer goes unnoticed. It surfaces one step later,
  # at the submit step, where the record filed is checked against the contract's
  # identity key [npi, payer] and a mismatch is MISFILED rather than confirmed.
  # That check is cross-system and cannot be fooled by the page, which is a
  # stronger guarantee than any postcondition here could have been.
  - step_key: portal.login
    intent: "sign in with the team credentials"
    tier: 2
    fires_form: true                # authentication posts no record; see spec 4.3
    credentials: {ref: portal, fields: [email, password]}
    postconditions:
      - text_present: "Two-step verification"
  - step_key: portal.verify_2fa
    # "confirm the not-a-robot checkbox" read as the whole of the step, so two live
    # runs entered the code, ticked the box and stopped without ever verifying.
    intent: "enter the authenticator code, tick the not-a-robot checkbox, and confirm the verification form"
    tier: 2
    fires_form: true                # authentication posts no record; see spec 4.3
    credentials: {ref: portal, fields: [otp]}
    postconditions:
      - text_present: "Providers pending enrollment"
  - step_key: provider.open
    intent: "open the record for provider {npi}"
    tier: 1
    postconditions:
      - text_present: "Provider record"
  - step_key: enrollment.select_payer
    intent: "select the payer named in the contract"
    tier: 2
  - step_key: enrollment.submit
    intent: "file this enrollment with the payer"
    tier: 3
    preconditions: [oracle.baseline_read]
    satisfied_when: oracle.confirmed
    postconditions:                 # deterministic page_verify predicates
      - text_present: "Submitted successfully"
      - text_absent: "Please confirm you have reviewed"

pii:
  redact: [password, otp]
  never_screenshot_urls: ["/", "/login", "/verify"]
