[project]
name = "vba"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.2.139",
    "playwright==1.49.0",
    "pydantic==2.12.5",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==0.24.0", "pydantic-evals==2.31.0"]
world = ["fastapi==0.115.6", "uvicorn==0.34.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A bare `pytest` runs the keyless tier only. The world tier needs a server and the
# evals tier spends money on a live model, so neither may be reachable by accident;
# ask for them by marker. A -m on the command line replaces this one.
addopts = "-m 'not world and not evals and not heldout'"
markers = [
    "world: needs the target world running on 127.0.0.1:8799",
    "evals: needs a model API key and costs money",
    "heldout: the frozen pass (spec 7.4); authored after the freeze, run once, failures recorded rather than fixed, and excluded by default because a held-out failure is a finding rather than a broken build",
]
